<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0e0e10;
    color:#efeff1;
    min-height:100vh;
}

.nav-links{
    height:50px;
    background:#18181b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    color:#BBDB6F;
    text-decoration:none;
    font-size:20px;
    font-weight:800;
}

.nav-menu{
    display:flex;
    gap:5px;
}

.nav-item{
    color:#ddd;
    text-decoration:none;
    padding:7px 12px;
    font-size:13px;
    border-radius:4px;
    cursor:pointer;
}

.nav-item:hover,
.nav-item.active{
    background:rgba(187,219,111,.15);
    color:#BBDB6F;
}

main{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

.container-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:20px;
    align-items:start;
}

.live-player,
.player-channel-area{
    background:#1f1f23;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.player-header{
    padding:12px 16px;
    background:#18181b;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-title{
    font-size:15px;
    font-weight:600;
}

.live-badge{
    background:#e50909;
    color:white;
    padding:3px 8px;
    border-radius:3px;
    font-size:10px;
    font-weight:bold;
}

.player-attributes{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    position:relative;
}

#playerPoster{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    z-index:2;
}

#videoPlayer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:none;
    background:#000;
    z-index:1;
}

.head-grid{
    display:flex;
    background:#18181b;
}

.head-grid>div{
    flex:1;
    padding:14px 8px;
    text-align:center;
    cursor:pointer;
    color:#aaa;
    border-bottom:2px solid transparent;
    font-size:13px;
}

.head-grid>div.active{
    color:#BBDB6F;
    border-bottom-color:#BBDB6F;
    background:rgba(187,219,111,.08);
}

.search-container{
    padding:12px;
    background:#18181b;
}

.search-container input{
    width:100%;
    padding:10px 13px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:6px;
    background:#0e0e10;
    color:white;
    outline:none;
}

.search-container input:focus{
    border-color:#BBDB6F;
}

.content-wrapper{
    display:flex;
}

.vertical-menu{
    width:48px;
    background:#18181b;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu-item{
    width:32px;
    height:32px;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#aaa;
}

.menu-item:hover,
.menu-item.active{
    background:rgba(187,219,111,.18);
    color:#BBDB6F;
}

#matchesContainer,
#channelsContainer{
    flex:1;
    max-height:550px;
    overflow-y:auto;
    padding:8px;
}

.match-item{
    background:#18181b;
    border:1px solid rgba(255,255,255,.05);
    border-radius:6px;
    padding:12px;
    margin-bottom:8px;
    cursor:pointer;
    transition:.2s;
}

.match-item:hover{
    background:#29292e;
    border-color:rgba(187,219,111,.4);
    transform:translateX(2px);
}

.match-item.aktif{
    background:rgba(187,219,111,.15);
    border-color:#BBDB6F;
}

.match-takimlar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    font-size:14px;
    font-weight:600;
}

.match-alt{
    display:flex;
    gap:8px;
    margin-top:6px;
    font-size:12px;
}

.match-saat{
    color:#ddd;
}

.match-divider{
    color:#666;
}

.match-lig{
    color:#999;
}

.canli-badge{
    background:rgba(187,219,111,.2);
    color:#BBDB6F;
    padding:2px 6px;
    border-radius:3px;
    font-size:9px;
}

.channel-icon{
    color:#BBDB6F;
    margin-right:7px;
}

/* BAKIM */

.bakim-box{
    padding:55px 20px;
    text-align:center;
}

.bakim-icon{
    font-size:42px;
    margin-bottom:15px;

.bakim-title{

#puanFrame{

.puan-baslik{

.telegram-box a{
    display:flex;

    padding:14px 16px;

    color:#fff;
    background:linear-gradient(135deg,#18181b,#202024);
    border:1px solid rgba(187,219,111,.25);

    box-shadow:0 4px 18px rgba(0,0,0,.4);

.telegram-box a:hover{

.telegram-icon{

.telegram-text{

.telegram-text strong{

    font-size:14px;
    margin-bottom:4px;

.telegram-text span{

.telegram-arrow{

.status-message{

@media(max-width:900px){

    }

    .telegram-box{
        margin-top:10px;
    }
}
</style>

/* ==================================================
   PLAYER
================================================== */

let hlsPlayer=null;

function playChannel(channel){

    const video =
        document.getElementById("videoPlayer");

    const poster =
        document.getElementById("playerPoster");

    const title =
        document.getElementById("currentChannel");

    title.textContent = channel.title;

    /*
       Kanal seçildiğinde poster gizlenir,
       video görünür.
    */

    poster.style.display = "none";
    video.style.display = "block";

    if(hlsPlayer){

        hlsPlayer.destroy();
        hlsPlayer=null;

    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    if(
        typeof Hls!=="undefined" &&
        Hls.isSupported()
    ){

        hlsPlayer=new Hls({
            enableWorker:true,
            lowLatencyMode:true
        });

        hlsPlayer.loadSource(channel.url);
        hlsPlayer.attachMedia(video);

        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play().catch(
                    function(){}
                );

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=channel.url;

        video.addEventListener(
            "loadedmetadata",
            function(){

                video.play().catch(
                    function(){}
                );

            },
            {once:true}
        );

    }

}

/* ==================================================
   KANALLARI OLUŞTUR
================================================== */

function populateChannels(
    filteredChannels=channels
){

    const container =
        document.getElementById(
            "channelsContainer"
        );

    container.innerHTML="";

    if(!filteredChannels.length){

        container.innerHTML =
            '<div class="status-message">Kanal bulunamadı.</div>';

        return;

    }

    filteredChannels.forEach(
        function(channel){

            const element =
                document.createElement("div");

            element.className="match-item";

            element.innerHTML=`

                <div class="match-takimlar">

                    <span>

                        <span class="channel-icon">
                            ●
                        </span>

                        ${escapeHTML(
                            channel.title
                        )}

                    </span>

                    <span class="canli-badge">
                        CANLI
                    </span>

                </div>

                <div class="match-alt">

                    <span class="match-saat">
                        CANLI
                    </span>

                    <span class="match-divider">
                        |
                    </span>

                    <span class="match-lig">
                        TV
                    </span>

                </div>
            `;

            element.addEventListener(
                "click",
                function(){

                    playChannel(channel);

                    document
                        .querySelectorAll(
                            ".match-item"
                        )
                        .forEach(
                            function(item){

                                item.classList.remove(
                                    "aktif"
                                );

                            }
                        );

                    element.classList.add(
                        "aktif"
                    );

                }
            );

            container.appendChild(element);

        }
    );

}

/* ==================================================
   SEKME SİSTEMİ
================================================== */

function hideAllContent(){

    document.getElementById(
        "matchesContainer"
    ).style.display="none";

    document.getElementById(
        "channelsContainer"
    ).style.display="none";

    document.getElementById(
        "puanContainer"
    ).style.display="none";

    document.getElementById(
        "searchBox"
    ).style.display="none";

    document.querySelector(
        ".vertical-menu"
    ).style.display="none";

}

function clearTabs(){

    document
        .querySelectorAll(
            ".head-grid > div"
        )
        .forEach(
            function(tab){

                tab.classList.remove(
                    "active"
                );

            }
        );

}

function showMatches(){

    hideAllContent();
    clearTabs();

    document.getElementById(
        "matchesContainer"
    ).style.display="block";

    document.getElementById(
        "live-tab"
    ).classList.add("active");

}

function showChannels(){

    hideAllContent();
    clearTabs();

    document.getElementById(
        "channelsContainer"
    ).style.display="block";

    document.getElementById(
        "searchBox"
    ).style.display="block";

    document.querySelector(
        ".vertical-menu"
    ).style.display="flex";

    document.getElementById(
        "next-tab"
    ).classList.add("active");

    populateChannels();

}

function showPuan(){

    hideAllContent();
    clearTabs();

    document.getElementById(
        "puanContainer"
    ).style.display="block";

    document.getElementById(
        "puan-tab"
    ).classList.add("active");

}

/* ==================================================
   ARAMA
================================================== */

document.getElementById(
    "macArama"
).addEventListener(
    "input",
    function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();

        const results =
            channels.filter(
                function(channel){

                    return channel.title
                        .toLowerCase()
                        .includes(keyword);

                }
            );

        populateChannels(results);

    }
);

/* ==================================================
   SAĞ PANEL BUTONLARI
================================================== */

document.getElementById(

document.getElementById(

document.getElementById(
    "puan-tab"

    showPuan
);

/* ==================================================
   GÜVENLİ HTML
================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ==================================================
   BAŞLANGIÇ
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        populateChannels();
        showChannels();

    }
);
